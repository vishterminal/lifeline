# Bill prefilter (spec F6). Tunable without code changes.
otp_patterns:
  - '\botp\b'
  - 'one[\s-]?time[\s-]?password'
  - 'do not share'
  - "don'?t share"
  - 'verification code'
  - 'ओटीपी'
  - 'கடவுச்சொல்'
